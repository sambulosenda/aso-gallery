name: Import apps from asoexamples.com

# Crawls asoexamples.com and adds its App Store apps to data/tracked.json.
# On a PR that changes the importer, the result is committed to the PR branch.
on:
  workflow_dispatch:
  pull_request:
    paths: ["scripts/import-asoexamples.ts", ".github/workflows/import-apps.yml"]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import:asoexamples
      - name: Commit tracked apps
        run: |
          git config user.name "aso-gallery bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tracked.json
          git diff --cached --quiet && echo "No new apps" && exit 0
          git commit -m "Track apps featured on asoexamples.com"
          git push
