name: Tag creative

# Tags new screenshots and headers with Claude after each daily capture, and
# commits the catalog. Needs the ANTHROPIC_API_KEY repository secret; without it
# the job skips tagging. On PRs that touch tagging, captures a sample of apps
# and compares two models on the same 50 images (see the run's summary),
# committing nothing.
on:
  workflow_run:
    workflows: ["Daily store capture"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      limit:
        description: "Most images to tag this run (caps spend)"
        required: false
        default: "10000"
  pull_request:
    paths: ["scripts/tag.ts", "scripts/compare-tags.ts", "lib/tagging.ts", ".github/workflows/tag.yml"]

permissions:
  contents: write

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    # After a capture, only when it succeeded and wasn't itself a PR dry run.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAG_MODEL: ${{ vars.TAG_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::ANTHROPIC_API_KEY secret is not set, so nothing was tagged."
      - name: Compare models on a sample (PR)
        if: github.event_name == 'pull_request' && env.ANTHROPIC_API_KEY != ''
        run: |
          npm run ingest -- --sample 12
          npm run compare-tags -- --limit 50
      - name: Tag
        if: github.event_name != 'pull_request' && env.ANTHROPIC_API_KEY != ''
        run: npm run tag -- --limit "${{ inputs.limit || '10000' }}"
      - name: Commit catalog
        if: github.event_name != 'pull_request' && env.ANTHROPIC_API_KEY != ''
        run: |
          git config user.name "aso-gallery bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Tag creative $(date -u +%F)"
          git push
