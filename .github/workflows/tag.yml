name: Tag creative

# Tags new screenshots and headers with Claude after each daily capture, and
# commits the catalog. Needs the ANTHROPIC_API_KEY repository secret; without it
# nothing is tagged. On PRs that touch tagging (or on demand with compare),
# captures a sample of apps and compares two models on the same 50 images
# (see the run's summary), with read-only access and nothing committed.
on:
  workflow_run:
    workflows: ["Daily store capture"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      limit:
        description: "Most images to tag this run (caps spend)"
        required: false
        default: "10000"
      compare:
        description: "Instead of tagging, compare two models on 50 freshly captured images"
        type: boolean
        default: false
  pull_request:
    paths: ["scripts/tag.ts", "scripts/compare-tags.ts", "lib/tagging.ts", ".github/workflows/tag.yml"]

permissions:
  contents: read

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name == 'pull_request' || inputs.compare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::ANTHROPIC_API_KEY secret is not set, so nothing was compared."
      - name: Compare models on a sample
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm run ingest -- --sample 12
          npm run compare-tags -- --limit 50

  tag:
    # After a capture, only when it succeeded and wasn't itself a PR dry run.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.compare) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TAG_MODEL: ${{ vars.TAG_MODEL }}
      TAG_LIMIT: ${{ inputs.limit || '10000' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for an API key
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::warning::ANTHROPIC_API_KEY secret is not set, so nothing was tagged."
      - name: Tag
        if: env.ANTHROPIC_API_KEY != ''
        run: npm run tag -- --limit "$TAG_LIMIT"
      - name: Commit catalog
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          git config user.name "aso-gallery bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Tag creative $(date -u +%F)"
          git push
