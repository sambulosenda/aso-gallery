name: Daily App Store capture

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  # On PRs that touch ingestion, do a dry run against the live App Store.
  pull_request:
    paths: ["scripts/**", "lib/**", "data/tracked.json", ".github/workflows/ingest.yml"]
  workflow_dispatch:
    inputs:
      app:
        description: "Only this App Store id (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Capture
        env:
          APP_ID: ${{ inputs.app }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then npm run ingest -- --dry-run
          elif [ -n "$APP_ID" ]; then npm run ingest -- --app "$APP_ID"
          else npm run ingest; fi
      - name: Commit catalog
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "aso-gallery bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily capture $(date -u +%F)"
          git push
